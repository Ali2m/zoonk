name: Apple App

on:
  push:
    branches: [ci/apple-tests-lab]

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  paired:
    name: paired ${{ matrix.replica }} ${{ matrix.first }} first
    strategy:
      fail-fast: false
      matrix:
        include:
          - { replica: 1, first: old }
          - { replica: 2, first: new }
          - { replica: 3, first: old }
          - { replica: 4, first: new }
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      COMMON: >-
        -quiet -skipPackagePluginValidation -packageAuthorizationProvider netrc
        -onlyUsePackageVersionsFromResolvedFile -skipPackageUpdates
        -project Zoonk.xcodeproj -scheme Zoonk CODE_SIGNING_ALLOWED=NO
        -only-testing:ZoonkTests
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore Swift packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/apple-source-packages
          key: ${{ runner.os }}-${{ runner.arch }}-apple-swiftpm-${{ hashFiles('apps/apple/**/Package.resolved') }}

      - name: Restore Xcode compilations
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/apple/DerivedData/Make/CompilationCache.noindex
          key: macOS-ARM64-apple-test-compilation-xcode-67c5b47bcf0e788aecae2f9b3af345813bdf7fe736faefb9666a7f4b2bf27ba7-d107ffe286bed8f65c372744194251fcfa84c5404c1248f5f97c672750feb890-9920adc3ffa7b4d6794d2392319aa7ac8d4a9454e0a4ead0c5f994186e3c828c
          fail-on-cache-miss: true

      - name: Pick simulator
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries | sort_by(.key) | .[].value[] | select(.name == "iPhone 17")] | last | .udid')
          echo "DEST=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"

      - name: Build A (${{ matrix.first }})
        working-directory: apps/apple
        run: |
          if [ "${{ matrix.first }}" = old ]; then
            xcodebuild $COMMON -derivedDataPath DerivedData/Old -clonedSourcePackagesDirPath "$RUNNER_TEMP/apple-source-packages" -destination "$DEST" build-for-testing
          else
            xcodebuild $COMMON -derivedDataPath DerivedData/Make -clonedSourcePackagesDirPath "$RUNNER_TEMP/apple-source-packages" -destination "$DEST" COMPILATION_CACHE_ENABLE_CACHING=YES COMPILER_INDEX_STORE_ENABLE=NO GCC_GENERATE_DEBUGGING_SYMBOLS=NO build-for-testing
          fi

      - name: Build B (the other)
        working-directory: apps/apple
        run: |
          if [ "${{ matrix.first }}" = new ]; then
            xcodebuild $COMMON -derivedDataPath DerivedData/Old -clonedSourcePackagesDirPath "$RUNNER_TEMP/apple-source-packages" -destination "$DEST" build-for-testing
          else
            xcodebuild $COMMON -derivedDataPath DerivedData/Make -clonedSourcePackagesDirPath "$RUNNER_TEMP/apple-source-packages" -destination "$DEST" COMPILATION_CACHE_ENABLE_CACHING=YES COMPILER_INDEX_STORE_ENABLE=NO GCC_GENERATE_DEBUGGING_SYMBOLS=NO build-for-testing
          fi
